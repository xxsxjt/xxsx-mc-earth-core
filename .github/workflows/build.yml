name: Build & Release Earth Core (JDK 25 / NeoForge 26.1.2)

on:
  push:
    branches: [ main, 'feat/**', 'refactor/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: earth_core
      - uses: actions/checkout@v4
        with:
          repository: xxsxjt/xxsx-mc-earth-lore
          ref: feat/creative-unlock-fast-study-and-requirements
          path: earth_lore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Earth Lore dependency
        working-directory: earth_lore/neoforge-26.1.2
        run: >
          gradle build --no-daemon
          -Dorg.gradle.java.installations.paths=$JAVA_HOME
      - name: Build & Test Earth Core
        working-directory: earth_core/neoforge-26.2
        run: >
          gradle build --no-daemon
          -Dorg.gradle.java.installations.paths=$JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: earth-on-minecraft-neoforge-26.1.2-jar
          path: earth_core/neoforge-26.2/build/libs/*.jar
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: earth_core/neoforge-26.2/build/libs/*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
